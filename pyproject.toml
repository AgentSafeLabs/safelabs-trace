[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safelabs-trace"
version = "0.1.0"
description = "Trace event model, action-severity tagger (rules v2b) and text-versus-action divergence metric for agent evaluation; source available for research reproducibility"
readme = "README.md"
license = { text = "Proprietary — all rights reserved, Safe Labs AI Inc." }
authors = [
    { name = "Waqar Javed", email = "waqar@agentsafelabs.io" },
]
requires-python = ">=3.11"
dependencies = [
    "safelabs-eval>=0.11.2",
    "pydantic>=2.0",
]
classifiers = [
    # "Private :: Do Not Upload" stays on purpose: it is not about repository visibility. It makes PyPI reject an accidental upload, and this package is
    # distributed through the repository (source available, all rights reserved), not through a package index.
    "Private :: Do Not Upload",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.4.0"]
adk = ["google-adk>=2.9"]
openai-agents = ["openai-agents>=0.18.0"]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safelabs_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
