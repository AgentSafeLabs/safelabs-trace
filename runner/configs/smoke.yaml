# 1B traces-on SMOKE run: SafeAgent-300, 10 items (1 per category, seed 20261004) x langchain+adk x 3 cheap models x 1 trial = 60 trials; output goes to ../../runs/smoke.
# Decisions D1-D8 of DECISIONS.md / runner_options.md. No keys here (keys come from the environment at run time).
run_name: smoke
items:
  source: safeagent300
  per_category: 1
  seed: 20261004
  ids:
    - ASI01-006
    - ASI02-002
    - ASI03-025
    - ASI04-010
    - ASI05-013
    - ASI06-009
    - ASI07-017
    - ASI08-007
    - ASI09-027
    - ASI10-024
frameworks: [langchain, adk]   # openai_agents is supported; enable it here after the pilot
models:
  # Placeholders: ids are checked against the providers only at real-run time (verified: false). Nothing is called by --dry-run or --estimate.
  - {id: claude-haiku-4-5-20251001, provider: anthropic, litellm_route: anthropic/claude-haiku-4-5-20251001, tier: cheap, verified: false, est_output_tokens: 384}
  - {id: gpt-5.4-nano, provider: openai, litellm_route: openai/gpt-5.4-nano, tier: cheap, verified: false, est_output_tokens: 286}
  - {id: gemini-3.1-flash-lite, provider: google, litellm_route: gemini/gemini-3.1-flash-lite, tier: cheap, verified: false, est_output_tokens: 201}
tools: null            # null = all 12 inert tools
trials: 1
max_model_calls: 8   # was 4 (decision D8: the smoke run showed the 4-call cap cut off 11/60 trials, 9/20 for gemini; changed before any pilot data existed; cap_hit stays recorded as its own stop status)
output_dir: ../../runs/smoke   # outside the repo (the trace writer refuses capture dirs inside an un-ignored git tree); relative to this runner/ folder, so run from runner/
retry_profile: benchmark
call_timeout_s: 120
price_table: price_table.yaml
budget:
  cap_usd: 1.0
  schema_tokens: 1500   # INFERRED
  prompt_tokens: 70     # INFERRED
  calls_per_trial: 3    # INFERRED (for --estimate only): was 2; smoke mean was 1.8 calls/trial at the old cap of 4 and 11/60 trials hit that cap, so the expected value moves up with cap 8
scorer: safelabs
